meters:
- name: synced_accounts
  description: Connected end-user calendar accounts in the billing period; the primary subscription metric.
  unit: accounts
  aggregation: max
  dimensions:
  - account
  - tier
- name: synced_account_overage
  description: Synced accounts above the tier allowance, billed per account per month.
  unit: accounts
  aggregation: sum
  dimensions:
  - account
  - tier
- name: api_calls
  description: API requests made against the Cronofy API; included (unlimited) on paid tiers.
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - api
- name: meeting_agent_hours
  description: Recording / transcription hours processed by Meeting Agents, billed per hour with a monthly minimum.
  unit: hours
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Track the count of synced accounts each month, the chief subscription cost driver, against the tier allowance.
- name: Allocation
  description: Map connected accounts and Meeting Agent usage to internal products or customers for chargeback.
- name: Optimization
  description: Disconnect dormant calendar accounts, right-size the tier (Emerging vs Growth) against overage rates, and use free/busy-only connections where event detail is not needed.
- name: Accountability
  description: Review synced-account growth and Meeting Agent spend monthly against budget and tier thresholds.
