publisherName: Cronofy
serviceCategory: Developer Tools and Scheduling
billingModel:
  pricingCategory: Subscription-Based
  billingFrequency: Annual
  billingCurrency: USD
  chargeCategories:
  - Usage
  - Purchase
  - Adjustment
focusColumns:
  ServiceName: Cronofy Scheduling API
  ServiceCategory: Developer Tools and Scheduling
  ProviderName: Cronofy
  PublisherName: Cronofy
  InvoiceIssuerName: Cronofy
  BillingCurrency: USD
  ChargeCategory: Purchase
