description: >-
  FinOps view of Cronofy spend. Cronofy bills a seat-based subscription
  metered on synced (connected) accounts, with tiered base fees (Emerging,
  Growth) that include an account allowance plus per-account overage, and a
  custom Strategic tier. Unlimited API calls are included; the primary cost
  driver is the number of connected end-user calendar accounts. Meeting
  Agents (recording / transcription) are billed separately per hour.
notes: >-
  Per-tier base fees, included account counts, and overage rates change;
  verify against the Cronofy API pricing page during reconciliation.
sources:
- https://www.cronofy.com/api-pricing
- https://www.cronofy.com/pricing
- https://focus.finops.org/focus-specification/v1-3/
