aid: cronofy
url: https://raw.githubusercontent.com/api-evangelist/cronofy/refs/heads/main/apis.yml
name: Cronofy
kind: company
description: Cronofy is a scheduling and calendar API platform that provides a unified
  interface to Google Calendar, Microsoft 365 / Outlook, Exchange, and Apple iCloud.
  Its REST API powers two-way calendar sync, real-time availability and scheduling,
  smart invites, scheduling links, and push notifications for software teams embedding
  scheduling into their products.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Scheduling
- Calendar
- Availability
- Booking
- Productivity
created: '2026-06-21'
modified: '2026-06-21'
specificationVersion: '0.19'
